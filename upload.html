<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Malarikkal Photos — Upload</title>
<meta name="robots" content="noindex, nofollow" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          lake: { DEFAULT: '#0B4F6C', teal: '#146C94', deep: '#082F3F' },
          lily: { pink: '#EC4899', rose: '#F43F5E' },
          gold: { DEFAULT: '#F4A100', light: '#FBBF24' },
          mist: '#FAF7F2',
          ink: '#0D2B36',
        },
        fontFamily: {
          display: ['Fraunces', 'serif'],
          body: ['Manrope', 'sans-serif'],
        },
      },
    },
  };
</script>

<style>
  body { font-family: 'Manrope', sans-serif; background: #FAF7F2; color: #0D2B36; }
  .font-display { font-family: 'Fraunces', serif; }

  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .skeleton {
    background: linear-gradient(90deg, rgba(11,79,108,0.06) 25%, rgba(11,79,108,0.14) 37%, rgba(11,79,108,0.06) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.6s ease-in-out infinite;
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }
  .animate-shake { animation: shake 0.5s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* =====================================================================
   CONFIG — edit these after deployment
   ===================================================================== */
// Same Apps Script URL as the main site (index.html) and admin.html.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysPjvA5_tNF4uAK8y2GseUYlYRFpEhxfaOc6iiEI_vuZZnxo1XzvJuYMDotw0xhVs/exec";

// Must EXACTLY match DASHBOARD_ACCESS_KEY in Code.gs.
const DASHBOARD_ACCESS_KEY = "mlrkl9x7Qp2vB4nWzR8tKd";

// Same PIN as admin.html works fine here too — they share one login,
// so unlocking either page unlocks both on that device.
const DASHBOARD_PIN = "98765";

// Every slot the main site can show a photo in. "id" must exactly match
// an entry in Code.gs's IMAGE_SLOTS list.
const SLOTS = [
  { id: "hero", label: "Hero Background", hint: "Homepage top banner" },
  { id: "gallery-1", label: "Gallery Photo 1", hint: "Featured — larger tile" },
  { id: "gallery-2", label: "Gallery Photo 2" },
  { id: "gallery-3", label: "Gallery Photo 3" },
  { id: "gallery-4", label: "Gallery Photo 4" },
  { id: "gallery-5", label: "Gallery Photo 5" },
  { id: "gallery-6", label: "Gallery Photo 6" },
  { id: "gallery-7", label: "Gallery Photo 7" },
  { id: "host-subash", label: "Subash's Photo", hint: "Our Hosts section" },
  { id: "host-akash", label: "Akash's Photo", hint: "Our Hosts section" },
  { id: "developer", label: "Developer Photo", hint: "About the Developer" },
];

/* =====================================================================
   ICONS
   ===================================================================== */
const Icon = ({ children, className = "w-5 h-5", ...props }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
       strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
    {children}
  </svg>
);
const IconLock = (p) => <Icon {...p}><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></Icon>;
const IconLogOut = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></Icon>;
const IconImage = (p) => <Icon {...p}><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></Icon>;
const IconLoader = (p) => <Icon {...p}><path d="M12 3a9 9 0 1 0 9 9"/></Icon>;
const IconCheck = (p) => <Icon {...p}><path d="M20 6 9 17l-5-5"/></Icon>;

/* =====================================================================
   HELPERS
   ===================================================================== */
/**
 * Resizes an image to a reasonable max dimension and re-encodes it as a
 * compressed JPEG before upload — keeps uploads fast on mobile data and
 * Drive storage small. Returns { base64, mimeType }.
 */
function resizeAndCompress(file, maxDim = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read file."));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not read image."));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", quality);
        resolve({ base64: dataUrl.split(",")[1], mimeType: "image/jpeg" });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* =====================================================================
   PIN GATE — same pattern/session as admin.html
   ===================================================================== */
function PinGate({ onUnlock }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);

  function handleSubmit(ev) {
    ev.preventDefault();
    if (pin === DASHBOARD_PIN) {
      try { localStorage.setItem("malarikkal_admin_authed", "true"); } catch (e) { /* ignore */ }
      onUnlock();
    } else {
      setError(true);
      setPin("");
      setTimeout(() => setError(false), 500);
    }
  }

  return (
    <div className="min-h-screen bg-lake-deep flex items-center justify-center p-6 font-body">
      <form onSubmit={handleSubmit} className={"bg-mist rounded-3xl p-8 w-full max-w-sm text-center " + (error ? "animate-shake" : "")}>
        <div className="w-14 h-14 rounded-full bg-lake/10 flex items-center justify-center mx-auto mb-4">
          <IconLock className="w-6 h-6 text-lake" />
        </div>
        <p className="font-display text-xl font-bold text-ink mb-1">Malarikkal Photos</p>
        <p className="text-ink/50 text-sm mb-6">Enter PIN to upload photos</p>
        <input
          type="password" inputMode="numeric" autoFocus value={pin}
          onChange={e => setPin(e.target.value.replace(/\D/g, ""))}
          className="w-full text-center text-2xl tracking-[0.5em] rounded-xl border-2 border-black/10 bg-white px-4 py-3 mb-4 focus:border-lily-rose focus:outline-none transition"
          placeholder="••••"
          maxLength={8}
        />
        {error && <p className="text-lily-rose text-xs mb-3">Wrong PIN, try again.</p>}
        <button type="submit" className="w-full bg-lily-rose text-white font-bold py-3.5 rounded-full active:scale-95 transition">
          Unlock
        </button>
      </form>
    </div>
  );
}

/* =====================================================================
   SLOT CARD
   ===================================================================== */
function SlotCard({ slot, currentUrl, onUploaded }) {
  const [status, setStatus] = useState("idle"); // idle | working | done | error
  const [preview, setPreview] = useState(currentUrl || "");
  const inputRef = useRef(null);

  useEffect(() => { setPreview(currentUrl || ""); }, [currentUrl]);

  async function handleFile(ev) {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    setStatus("working");
    try {
      const { base64, mimeType } = await resizeAndCompress(file);
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ type: "image", key: DASHBOARD_ACCESS_KEY, slot: slot.id, mimeType, base64 }),
      });
      const data = await res.json();
      if (data.success) {
        setPreview(data.imageUrl);
        setStatus("done");
        onUploaded(slot.id, data.imageUrl);
        setTimeout(() => setStatus("idle"), 2500);
      } else {
        setStatus("error");
      }
    } catch (err) {
      setStatus("error");
    } finally {
      if (inputRef.current) inputRef.current.value = "";
    }
  }

  return (
    <div className="bg-white rounded-3xl p-4 shadow-sm border border-black/5 flex items-center gap-4">
      <div className="w-16 h-16 rounded-2xl overflow-hidden bg-mist flex items-center justify-center shrink-0">
        {preview ? (
          <img src={preview} alt={slot.label} className="w-full h-full object-cover" />
        ) : (
          <IconImage className="w-6 h-6 text-ink/20" />
        )}
      </div>

      <div className="flex-1 min-w-0">
        <p className="font-semibold text-ink text-sm truncate">{slot.label}</p>
        {slot.hint && <p className="text-xs text-ink/40 truncate">{slot.hint}</p>}
        {status === "error" && <p className="text-xs text-lily-rose mt-1">Upload failed — try again.</p>}
      </div>

      <label className="shrink-0">
        <input ref={inputRef} type="file" accept="image/*" className="hidden" onChange={handleFile} disabled={status === "working"} />
        <span className={"inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-full text-xs font-bold cursor-pointer active:scale-95 transition min-w-[76px] " +
          (status === "working" ? "bg-ink/10 text-ink/40" : preview ? "bg-lake text-white" : "bg-lily-rose text-white")}>
          {status === "working" ? <IconLoader className="w-4 h-4 animate-spin" /> :
           status === "done" ? <IconCheck className="w-4 h-4" /> : preview ? "Change" : "Upload"}
        </span>
      </label>
    </div>
  );
}

/* =====================================================================
   APP
   ===================================================================== */
function App() {
  const [authed, setAuthed] = useState(() => {
    try { return localStorage.getItem("malarikkal_admin_authed") === "true"; } catch (e) { return false; }
  });
  const [images, setImages] = useState({});
  const [loading, setLoading] = useState(true);

  async function loadImages() {
    setLoading(true);
    try {
      const res = await fetch(APPS_SCRIPT_URL + "?action=images");
      const data = await res.json();
      if (data.success) setImages(data.images || {});
    } catch (e) { /* slots just show empty; uploading still works */ }
    setLoading(false);
  }

  useEffect(() => { if (authed) loadImages(); }, [authed]);

  function handleLogout() {
    try { localStorage.removeItem("malarikkal_admin_authed"); } catch (e) { /* ignore */ }
    setAuthed(false);
  }

  function handleUploaded(slotId, url) {
    setImages(prev => ({ ...prev, [slotId]: url }));
  }

  if (!authed) return <PinGate onUnlock={() => setAuthed(true)} />;

  return (
    <div className="min-h-screen bg-mist font-body pb-10">
      <header className="bg-lake-deep text-white px-5 py-5 sticky top-0 z-10 shadow-md">
        <div className="flex items-center justify-between">
          <div>
            <p className="font-display text-xl font-bold leading-tight">Photo Upload</p>
            <p className="text-white/50 text-xs">Malarikkal Website</p>
          </div>
          <button onClick={handleLogout} aria-label="Logout"
            className="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center active:scale-90 transition">
            <IconLogOut className="w-4 h-4" />
          </button>
        </div>
      </header>

      <div className="px-5 pt-5 max-w-xl mx-auto">
        <p className="text-ink/50 text-sm mb-5">
          Tap "Change" on any photo to replace it from your gallery. Updates appear on the live site within a few seconds — no need to touch GitHub.
        </p>

        {loading ? (
          <div className="space-y-3">
            {[0, 1, 2, 3, 4].map(i => <div key={i} className="skeleton h-20 rounded-3xl"></div>)}
          </div>
        ) : (
          <div className="space-y-3">
            {SLOTS.map(slot => (
              <SlotCard key={slot.id} slot={slot} currentUrl={images[slot.id]} onUploaded={handleUploaded} />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
