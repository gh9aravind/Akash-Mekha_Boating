<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Malarikkal Photo Studio</title>
<meta name="robots" content="noindex, nofollow" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          lake: { DEFAULT: '#0B4F6C', teal: '#146C94', deep: '#082F3F' },
          lily: { pink: '#EC4899', rose: '#F43F5E' },
          gold: { DEFAULT: '#F4A100', light: '#FBBF24' },
          mist: '#FAF7F2',
          ink: '#0D2B36',
        },
        fontFamily: {
          display: ['Fraunces', 'serif'],
          body: ['Manrope', 'sans-serif'],
        },
      },
    },
  };
</script>

<style>
  body { font-family: 'Manrope', sans-serif; background: #FAF7F2; color: #0D2B36; }
  .font-display { font-family: 'Fraunces', serif; }

  @keyframes floatSlow { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .animate-float { animation: floatSlow 8s ease-in-out infinite; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-up { animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both; }

  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }
  .animate-shake { animation: shake 0.5s; }

  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .skeleton {
    background: linear-gradient(90deg, rgba(11,79,108,0.06) 25%, rgba(11,79,108,0.14) 37%, rgba(11,79,108,0.06) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.6s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* =====================================================================
   CONFIG — edit these after deployment
   ===================================================================== */
const APPS_SCRIPT_URL = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
const DASHBOARD_ACCESS_KEY = "PASTE_THE_SAME_SECRET_KEY_FROM_CODE.GS_HERE";
const DASHBOARD_PIN = "1234"; // same session as admin.html — can share the PIN or use a different one

// Every slot the main site can show a photo in, grouped for display.
// Each "id" must exactly match an entry in Code.gs's IMAGE_SLOTS list.
const SECTIONS = [
  {
    title: "Homepage", eyebrow: "First impression",
    slots: [{ id: "hero", label: "Hero Background", tall: true }],
  },
  {
    title: "Gallery", eyebrow: "Photo grid",
    slots: [
      { id: "gallery-1", label: "Photo 1" },
      { id: "gallery-2", label: "Photo 2" },
      { id: "gallery-3", label: "Photo 3" },
      { id: "gallery-4", label: "Photo 4" },
      { id: "gallery-5", label: "Photo 5" },
      { id: "gallery-6", label: "Photo 6" },
      { id: "gallery-7", label: "Photo 7" },
      { id: "gallery-8", label: "Photo 8" },
      { id: "gallery-9", label: "Photo 9" },
      { id: "gallery-10", label: "Photo 10" },
      { id: "gallery-11", label: "Photo 11" },
      { id: "gallery-12", label: "Photo 12" },
    ],
  },
  {
    title: "People", eyebrow: "Faces behind the boat",
    slots: [
      { id: "host-subash", label: "Subash", round: true },
      { id: "host-akash", label: "Akash", round: true },
      { id: "developer", label: "Developer", round: true },
    ],
  },
];
const ALL_SLOTS = SECTIONS.flatMap(s => s.slots);

/* =====================================================================
   ICONS
   ===================================================================== */
const Icon = ({ children, className = "w-5 h-5", ...props }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
       strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
    {children}
  </svg>
);
const IconLock = (p) => <Icon {...p}><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></Icon>;
const IconLogOut = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></Icon>;
const IconPlus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const IconEdit = (p) => <Icon {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></Icon>;
const IconLoader = (p) => <Icon {...p}><path d="M12 3a9 9 0 1 0 9 9"/></Icon>;
const IconCheck = (p) => <Icon {...p}><path d="M20 6 9 17l-5-5"/></Icon>;
const IconX = (p) => <Icon {...p}><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></Icon>;
const IconFlower = (p) => <Icon {...p}><circle cx="12" cy="12" r="2.2"/><path d="M12 2c1.8 0 3 1.5 3 3.2S13.8 9 12 9s-3-1.5-3-3.8S10.2 2 12 2Z"/><path d="M12 22c1.8 0 3-1.5 3-3.2S13.8 15 12 15s-3 1.5-3 3.8S10.2 22 12 22Z"/><path d="M2 12c0-1.8 1.5-3 3.2-3S9 10.2 9 12s-1.5 3-3.8 3S2 13.8 2 12Z"/><path d="M22 12c0 1.8-1.5 3-3.2 3S15 13.8 15 12s1.5-3 3.8-3S22 10.2 22 12Z"/></Icon>;

/* =====================================================================
   HELPERS
   ===================================================================== */
function resizeAndCompress(file, maxDim = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read file."));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not read image."));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", quality);
        resolve({ base64: dataUrl.split(",")[1], mimeType: "image/jpeg" });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* =====================================================================
   PIN GATE
   ===================================================================== */
function PinGate({ onUnlock }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);

  function handleSubmit(ev) {
    ev.preventDefault();
    if (pin === DASHBOARD_PIN) {
      try { localStorage.setItem("malarikkal_admin_authed", "true"); } catch (e) { /* ignore */ }
      onUnlock();
    } else {
      setError(true);
      setPin("");
      setTimeout(() => setError(false), 500);
    }
  }

  return (
    <div className="min-h-screen bg-gradient-to-br from-lake-deep via-lake to-lake-teal flex items-center justify-center p-6 font-body relative overflow-hidden">
      <div className="absolute -top-16 -right-16 w-64 h-64 rounded-full bg-gold/25 blur-3xl animate-float" aria-hidden="true" />
      <div className="absolute -bottom-16 -left-16 w-64 h-64 rounded-full bg-lily-pink/25 blur-3xl animate-float" aria-hidden="true" />

      <form onSubmit={handleSubmit} className={"relative bg-mist rounded-3xl p-8 w-full max-w-sm text-center shadow-2xl " + (error ? "animate-shake" : "")}>
        <div className="w-14 h-14 rounded-full bg-lake/10 flex items-center justify-center mx-auto mb-4">
          <IconLock className="w-6 h-6 text-lake" />
        </div>
        <p className="font-display text-2xl font-bold text-ink mb-1">Photo Studio</p>
        <p className="text-ink/50 text-sm mb-6">Enter PIN to manage site photos</p>
        <input
          type="password" inputMode="numeric" autoFocus value={pin}
          onChange={e => setPin(e.target.value.replace(/\D/g, ""))}
          className="w-full text-center text-2xl tracking-[0.5em] rounded-xl border-2 border-black/10 bg-white px-4 py-3 mb-4 focus:border-lily-rose focus:outline-none transition"
          placeholder="••••"
          maxLength={8}
        />
        {error && <p className="text-lily-rose text-xs mb-3">Wrong PIN, try again.</p>}
        <button type="submit" className="w-full bg-lily-rose text-white font-bold py-3.5 rounded-full active:scale-95 transition">
          Unlock
        </button>
      </form>
    </div>
  );
}

/* =====================================================================
   PHOTO TILE — the whole tile is the upload button; state (empty / has
   photo / uploading / done / error) is shown as an overlay on the tile
   itself instead of a separate small button.
   ===================================================================== */
function PhotoTile({ slot, currentUrl, onUploaded }) {
  const [status, setStatus] = useState("idle"); // idle | working | done | error
  const [preview, setPreview] = useState(currentUrl || "");
  // "drive" = showing the uploaded-via-this-portal photo, "local" = falling
  // back to the images/*.jpg file already in the repo (from the old GitHub
  // upload method), "empty" = neither exists yet.
  const [stage, setStage] = useState(currentUrl ? "drive" : "local");
  const inputRef = useRef(null);
  const localSrc = "images/" + slot.id + ".jpg";

  useEffect(() => {
    setPreview(currentUrl || "");
    setStage(currentUrl ? "drive" : "local");
  }, [currentUrl]);

  function handleImgError() {
    setStage(prev => (prev === "drive" ? "local" : "empty"));
  }

  async function handleFile(ev) {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    setStatus("working");
    try {
      const { base64, mimeType } = await resizeAndCompress(file);
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ type: "image", key: DASHBOARD_ACCESS_KEY, slot: slot.id, mimeType, base64 }),
      });
      const data = await res.json();
      if (data.success) {
        setPreview(data.imageUrl);
        setStage("drive");
        setStatus("done");
        onUploaded(slot.id, data.imageUrl);
        setTimeout(() => setStatus("idle"), 1800);
      } else {
        setStatus("error");
        setTimeout(() => setStatus("idle"), 1800);
      }
    } catch (err) {
      setStatus("error");
      setTimeout(() => setStatus("idle"), 1800);
    } finally {
      if (inputRef.current) inputRef.current.value = "";
    }
  }

  const shape = slot.tall ? "aspect-[16/10] rounded-3xl" : slot.round ? "aspect-square rounded-full" : "aspect-square rounded-2xl";
  const displaySrc = stage === "drive" ? preview : stage === "local" ? localSrc : "";

  return (
    <label className={"relative overflow-hidden cursor-pointer group block transition active:scale-[0.97] " + shape +
      (displaySrc ? " shadow-sm" : " border-2 border-dashed border-lake/25 bg-white hover:border-lily-rose/50")}>
      <input ref={inputRef} type="file" accept="image/*" className="hidden" onChange={handleFile} disabled={status === "working"} />

      {displaySrc ? (
        <img src={displaySrc} alt={slot.label} onError={handleImgError}
          className="absolute inset-0 w-full h-full object-cover transition duration-300 group-hover:scale-105" />
      ) : (
        <div className="absolute inset-0 flex flex-col items-center justify-center gap-1.5 p-2">
          <div className="w-8 h-8 rounded-full bg-lily-rose/10 flex items-center justify-center">
            <IconPlus className="w-4 h-4 text-lily-rose" />
          </div>
          <span className={"font-semibold text-ink/40 text-center leading-tight " + (slot.round ? "text-[9px]" : "text-[11px]")}>{slot.label}</span>
        </div>
      )}

      {displaySrc && (
        <>
          <div className={"absolute inset-x-0 bottom-0 bg-gradient-to-t from-ink/75 to-transparent " + (slot.round ? "p-2 rounded-b-full" : slot.tall ? "p-4" : "p-2")}>
            <p className={"font-semibold text-white truncate " + (slot.round ? "text-[9px] text-center" : slot.tall ? "text-sm" : "text-[11px]")}>{slot.label}</p>
          </div>
          <div className={"absolute w-7 h-7 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center opacity-0 group-hover:opacity-100 transition " + (slot.round ? "top-0 right-0" : "top-2 right-2")}>
            <IconEdit className="w-3.5 h-3.5 text-white" />
          </div>
        </>
      )}

      {status === "working" && (
        <div className="absolute inset-0 bg-ink/60 flex items-center justify-center">
          <IconLoader className="w-6 h-6 text-white animate-spin" />
        </div>
      )}
      {status === "done" && (
        <div className="absolute inset-0 bg-lake/85 flex items-center justify-center">
          <IconCheck className="w-7 h-7 text-white" />
        </div>
      )}
      {status === "error" && (
        <div className="absolute inset-0 bg-lily-rose/85 flex items-center justify-center">
          <IconX className="w-6 h-6 text-white" />
        </div>
      )}
    </label>
  );
}

function Section({ section, images, onUploaded, delay }) {
  const gridClass = section.slots.length === 1 ? "" : "grid grid-cols-3 gap-3";
  return (
    <div className="mb-8 animate-fade-up" style={{ animationDelay: delay + "ms" }}>
      <p className="text-[11px] font-bold text-lily-rose uppercase tracking-widest mb-1 flex items-center gap-1.5">
        <IconFlower className="w-3.5 h-3.5" /> {section.eyebrow}
      </p>
      <h2 className="font-display text-xl font-bold text-ink mb-4">{section.title}</h2>
      <div className={gridClass}>
        {section.slots.map(slot => (
          <PhotoTile key={slot.id} slot={slot} currentUrl={images[slot.id]} onUploaded={onUploaded} />
        ))}
      </div>
    </div>
  );
}

/* =====================================================================
   APP
   ===================================================================== */
function App() {
  const [authed, setAuthed] = useState(() => {
    try { return localStorage.getItem("malarikkal_admin_authed") === "true"; } catch (e) { return false; }
  });
  const [images, setImages] = useState({});
  const [loading, setLoading] = useState(true);

  async function loadImages() {
    setLoading(true);
    try {
      const res = await fetch(APPS_SCRIPT_URL + "?action=images");
      const data = await res.json();
      if (data.success) setImages(data.images || {});
    } catch (e) { /* slots just show empty; uploading still works */ }
    setLoading(false);
  }

  useEffect(() => { if (authed) loadImages(); }, [authed]);

  function handleLogout() {
    try { localStorage.removeItem("malarikkal_admin_authed"); } catch (e) { /* ignore */ }
    setAuthed(false);
  }

  function handleUploaded(slotId, url) {
    setImages(prev => ({ ...prev, [slotId]: url }));
  }

  if (!authed) return <PinGate onUnlock={() => setAuthed(true)} />;

  const filledCount = ALL_SLOTS.filter(s => images[s.id]).length;
  const progress = ALL_SLOTS.length ? Math.round((filledCount / ALL_SLOTS.length) * 100) : 0;

  return (
    <div className="min-h-screen bg-mist font-body pb-16">
      <header className="relative bg-gradient-to-br from-lake-deep via-lake to-lake-teal text-white px-5 pt-8 pb-12 overflow-hidden">
        <div className="absolute -top-10 -right-10 w-56 h-56 rounded-full bg-gold/25 blur-3xl animate-float" aria-hidden="true" />
        <div className="absolute bottom-0 left-0 w-40 h-40 rounded-full bg-lily-pink/20 blur-3xl animate-float" aria-hidden="true" />

        <button onClick={handleLogout} aria-label="Logout"
          className="absolute top-6 right-5 w-9 h-9 rounded-full bg-white/10 flex items-center justify-center active:scale-90 transition">
          <IconLogOut className="w-4 h-4" />
        </button>

        <div className="relative max-w-xl mx-auto">
          <p className="text-white/50 text-xs font-semibold uppercase tracking-widest mb-1">Malarikkal Website</p>
          <h1 className="font-display text-3xl font-bold mb-5">Photo Studio</h1>

          <div className="flex items-center gap-3">
            <div className="flex-1 h-2 rounded-full bg-white/15 overflow-hidden">
              <div className="h-full bg-gold rounded-full transition-all duration-700" style={{ width: progress + "%" }} />
            </div>
            <span className="text-xs font-bold text-white/80 shrink-0">{filledCount}/{ALL_SLOTS.length} uploaded here</span>
          </div>
        </div>
      </header>

      <div className="px-5 -mt-6 max-w-xl mx-auto relative">
        <div className="bg-white rounded-3xl p-5 md:p-6 shadow-xl shadow-black/5">
          {loading ? (
            <div className="space-y-3">
              <div className="skeleton aspect-[16/10] rounded-3xl"></div>
              <div className="grid grid-cols-3 gap-3">
                {[0, 1, 2].map(i => <div key={i} className="skeleton aspect-square rounded-2xl"></div>)}
              </div>
            </div>
          ) : (
            SECTIONS.map((section, i) => (
              <Section key={section.title} section={section} images={images} onUploaded={handleUploaded} delay={i * 100} />
            ))
          )}
        </div>

        <p className="text-center text-ink/30 text-xs mt-5">
          Tap any photo to upload or replace it. Changes appear on the live site within a few seconds.
          Photos already added via GitHub still show here too — tap one to replace it the easy way from now on.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
