/* =====================================================================
   HELPERS
   ===================================================================== */
function formatINR(n) { return "₹" + Number(n).toLocaleString("en-IN"); }

function generateBookingId() {
  const stamp = Date.now().toString(36).toUpperCase().slice(-5);
  const rand = Math.random().toString(36).toUpperCase().slice(2, 5);
  return "MWL-" + stamp + rand;
}

function buildWhatsAppMessage(b) {
  const lines = [
    "🌸 *Malarikkal Boat Tour Booking*",
    "Booking ID: " + b.bookingId,
    "Name: " + b.name,
    "Phone: " + b.phone,
    "Date: " + b.date,
    "Slot: " + b.timeSlotLabel,
    "Adults: " + b.adults + ", Kids: " + b.kids,
    "Total: " + formatINR(b.totalPrice),
  ];
  return encodeURIComponent(lines.join("\n"));
}

function downloadReceipt(b) {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert("Receipt tool is still loading — please try again in a moment.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: [360, 580] });

  const inkColor = [13, 43, 54];
  const lakeColor = [11, 79, 108];
  const roseColor = [244, 63, 94];
  const goldColor = [244, 161, 0];
  const mistColor = [250, 247, 242];

  // Header band
  doc.setFillColor(...lakeColor);
  doc.rect(0, 0, 360, 110, "F");
  doc.setTextColor(255, 255, 255);
  doc.setFont("times", "bold");
  doc.setFontSize(20);
  doc.text("Malarikkal Water Lily", 180, 46, { align: "center" });
  doc.text("Boat Tours", 180, 68, { align: "center" });
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.setTextColor(230, 230, 230);
  doc.text("Kottayam, Kerala", 180, 86, { align: "center" });

  // Background
  doc.setFillColor(...mistColor);
  doc.rect(0, 110, 360, 470, "F");

  // Title
  doc.setTextColor(...inkColor);
  doc.setFont("times", "bold");
  doc.setFontSize(15);
  doc.text("Booking Receipt", 180, 140, { align: "center" });
  doc.setDrawColor(...roseColor);
  doc.setLineWidth(1);
  doc.line(40, 152, 320, 152);

  // Details table
  const rows = [
    ["Booking ID", b.bookingId],
    ["Guest Name", b.name],
    ["Phone", b.phone],
    ["Date", b.date],
    ["Time Slot", b.timeSlotLabel],
    ["Adults", String(b.adults)],
    ["Kids", String(b.kids)],
  ];
  let y = 180;
  doc.setFontSize(10.5);
  rows.forEach(([label, value]) => {
    doc.setFont("helvetica", "normal");
    doc.setTextColor(120, 120, 120);
    doc.text(label, 40, y);
    doc.setFont("helvetica", "bold");
    doc.setTextColor(...inkColor);
    doc.text(String(value), 320, y, { align: "right" });
    y += 24;
  });

  // Total
  doc.setDrawColor(220, 220, 220);
  doc.line(40, y + 4, 320, y + 4);
  y += 32;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(11);
  doc.setTextColor(120, 120, 120);
  doc.text("Total Amount", 40, y);
  doc.setFont("times", "bold");
  doc.setFontSize(20);
  doc.setTextColor(...roseColor);
  doc.text("Rs. " + Number(b.totalPrice).toLocaleString("en-IN"), 320, y, { align: "right" });

  // Note
  y += 34;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.setTextColor(120, 120, 120);
  doc.text("Pay directly at the jetty. Please show this receipt or", 40, y);
  doc.text("your Booking ID on arrival.", 40, y + 13);

  // Footer band
  doc.setFillColor(...goldColor);
  doc.rect(0, 545, 360, 35, "F");
  doc.setTextColor(...inkColor);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(9);
  doc.text("Call / WhatsApp: " + OWNER_PHONE, 180, 567, { align: "center" });

  doc.save("Malarikkal-Receipt-" + b.bookingId + ".pdf");
}

function todayISO() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

function SectionEyebrow({ children }) {

      <IconFlower className="w-4 h-4" /> {children}
    </p>

}

function Counter({ label, sub, value, onChange, min = 0, max = 12 }) {
  return (
    <div className="flex items-center justify-between glass rounded-2xl px-4 py-3">
      <div>
        <p className="font-semibold text-ink text-sm">{label}</p>
        {sub && <p className="text-xs text-ink/60">{sub}</p>}
      </div>
      <div className="flex items-center gap-3">
        <button type="button" aria-label={"Decrease " + label}
          onClick={() => onChange(Math.max(min, value - 1))}
          className="w-8 h-8 rounded-full bg-lake text-white flex items-center justify-center active:scale-90 transition disabled:opacity-30"
          disabled={value <= min}>
          <IconMinus className="w-4 h-4" />
        </button>
        <span className="w-6 text-center font-bold font-display text-lg text-ink">{value}</span>
        <button type="button" aria-label={"Increase " + label}
          onClick={() => onChange(Math.min(max, value + 1))}
          className="w-8 h-8 rounded-full bg-lily-rose text-white flex items-center justify-center active:scale-90 transition disabled:opacity-30"
          disabled={value >= max}>
          <IconPlus className="w-4 h-4" />
        </button>
      </div>
    </div>
  );
}

/* =====================================================================
   BOOKING FORM
   ===================================================================== */
function BookingSection({ formRef }) {
  const [timeSlot, setTimeSlot] = useState(TIME_SLOTS[0].id);
  const [date, setDate] = useState("");
  const [adults, setAdults] = useState(2);
  const [kids, setKids] = useState(0);
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [errors, setErrors] = useState({});
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState("");
  const [successData, setSuccessData] = useState(null);

  const slot = TIME_SLOTS.find(s => s.id === timeSlot);
  const total = useMemo(() => adults * slot.adult + kids * slot.kid, [adults, kids, slot]);

  function validate() {
    const e = {};
    if (!name.trim() || name.trim().length < 2) e.name = "Please enter your full name.";
    const digits = phone.replace(/\D/g, "");
    if (!/^[6-9]\d{9}$/.test(digits)) e.phone = "Enter a valid 10-digit mobile number.";
    if (!date) e.date = "Please choose a date.";
    else if (date < todayISO()) e.date = "Pick a date from today onward.";
    if (adults < 1) e.adults = "At least 1 adult is required.";
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  async function handleSubmit(ev) {
    ev.preventDefault();
    setSubmitError("");
    if (!validate()) return;

    const booking = {
      bookingId: generateBookingId(),
      name: name.trim(),
      phone: phone.replace(/\D/g, ""),
      date,
      timeSlot: slot.id,
      timeSlotLabel: slot.label + " (" + slot.range + ")",
      adults, kids,
      totalPrice: total,
      timestamp: new Date().toISOString(),
    };

    setIsSubmitting(true);
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        // text/plain avoids a CORS preflight against Apps Script (see SETUP_GUIDE.md)
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(booking),
      });
      const result = await res.json();
      if (result.success) {
        setSuccessData(booking);
        setName(""); setPhone(""); setDate(""); setAdults(2); setKids(0);
      } else {
        setSubmitError(result.error || "Booking could not be saved. Please try WhatsApp instead.");
      }
    } catch (err) {
      setSubmitError("Could not reach the booking server. You can send your details via WhatsApp instead.");
    } finally {
      setIsSubmitting(false);
    }
  }

  return (
    <section id="book" ref={formRef} className="relative bg-lake-deep py-16 md:py-24">
      <div className="max-w-5xl mx-auto px-5 md:px-6">
        <div className="text-center max-w-xl mx-auto mb-10">
          <SectionEyebrow>Reserve your slot</SectionEyebrow>
          <h2 className="font-display text-3xl md:text-4xl font-semibold text-white">Book Your Boat Ride</h2>
          <p className="text-white/60 mt-3 text-sm md:text-base">Instant confirmation. No advance payment — pay directly at the jetty.</p>
        </div>

        <form onSubmit={handleSubmit} className="glass rounded-3xl p-5 md:p-8 shadow-2xl">
          {/* Time slot */}
          <p className="font-semibold text-ink mb-3 text-sm">Choose a time slot</p>
          <div className="grid sm:grid-cols-3 gap-3 mb-6">
            {TIME_SLOTS.map(s => {
              const SlotIcon = s.icon;
              const active = timeSlot === s.id;
              return (
                <button type="button" key={s.id} onClick={() => setTimeSlot(s.id)}
                  className={"text-left rounded-2xl p-4 border-2 transition " + (active ? "border-lily-rose bg-white shadow-lg" : "border-white/50 bg-white/40 hover:bg-white/70")}>
                  <SlotIcon className={"w-5 h-5 mb-2 " + (active ? "text-lily-rose" : "text-lake")} />
                  <p className="font-bold text-ink text-sm">{s.label}</p>
                  <p className="text-xs text-ink/60 mb-1">{s.range}</p>
                  <p className="text-[11px] font-semibold text-lake-teal">{s.tag}</p>
                  <p className="text-xs font-bold text-lily-rose mt-1">{formatINR(s.adult)}/adult</p>
                </button>
              );
            })}
          </div>

          {/* Date */}
          <div className="mb-6">
            <label className="font-semibold text-ink text-sm mb-2 flex items-center gap-1.5" htmlFor="date">
              <IconCalendar className="w-4 h-4" /> Tour date
            </label>
            <input id="date" type="date" min={todayISO()} value={date} onChange={e => setDate(e.target.value)}
              className="w-full rounded-xl border-2 border-white/70 bg-white/70 px-4 py-3 text-ink font-medium focus:border-lily-rose transition" />
            {errors.date && <p className="text-lily-rose text-xs mt-1">{errors.date}</p>}
          </div>

          {/* Counters */}
          <div className="grid sm:grid-cols-2 gap-3 mb-6">
            <Counter label="Adults" sub="Age 13+" value={adults} onChange={setAdults} min={1} />
            <Counter label="Kids" sub="Age 3–12" value={kids} onChange={setKids} min={0} />
          </div>
          {errors.adults && <p className="text-lily-rose text-xs -mt-4 mb-4">{errors.adults}</p>}

          {/* Name / phone */}
          <div className="grid sm:grid-cols-2 gap-4 mb-6">
            <div>
              <label className="font-semibold text-ink text-sm mb-2 flex items-center gap-1.5" htmlFor="name">
                <IconUser className="w-4 h-4" /> Full name
              </label>
              <input id="name" type="text" value={name} onChange={e => setName(e.target.value)} placeholder="Your name"
                className="w-full rounded-xl border-2 border-white/70 bg-white/70 px-4 py-3 text-ink focus:border-lily-rose transition" />
              {errors.name && <p className="text-lily-rose text-xs mt-1">{errors.name}</p>}
            </div>
            <div>
              <label className="font-semibold text-ink text-sm mb-2 flex items-center gap-1.5" htmlFor="phone">
                <IconPhone className="w-4 h-4" /> WhatsApp number
              </label>
              <input id="phone" type="tel" value={phone} onChange={e => setPhone(e.target.value)} placeholder="98765 43210"
                className="w-full rounded-xl border-2 border-white/70 bg-white/70 px-4 py-3 text-ink focus:border-lily-rose transition" />
              {errors.phone && <p className="text-lily-rose text-xs mt-1">{errors.phone}</p>}
            </div>
          </div>

          {/* Total + submit */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-5 border-t border-white/50">
            <div>
              <p className="text-xs text-ink/60 uppercase tracking-widest font-semibold">Total price</p>
              <p className="font-display text-3xl font-bold text-lake">{formatINR(total)}</p>
              <p className="text-xs text-ink/50">{adults} adult{adults !== 1 ? "s" : ""}{kids > 0 ? " · " + kids + " kid" + (kids !== 1 ? "s" : "") : ""}</p>
            </div>
            <button type="submit" disabled={isSubmitting}
              className="inline-flex items-center justify-center gap-2 bg-lily-rose hover:bg-lily-pink disabled:opacity-60 text-white font-bold px-8 py-4 rounded-full shadow-lg shadow-lily-rose/30 transition hover:-translate-y-0.5">
              {isSubmitting ? (<><IconLoader className="w-5 h-5 animate-spin" /> Booking…</>) : (<>Confirm Booking <IconArrowRight className="w-4 h-4" /></>)}
            </button>
          </div>

          {submitError && (
            <div className="mt-5 bg-lily-rose/10 border border-lily-rose/40 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <p className="text-sm text-lily-rose font-medium">{submitError}</p>
              <a href={"https://wa.me/" + WHATSAPP_NUMBER + "?text=" + buildWhatsAppMessage({ bookingId: "(pending)", name, phone, date, timeSlotLabel: slot.label, adults, kids, totalPrice: total })}
                target="_blank" rel="noopener noreferrer"
                className="inline-flex items-center justify-center gap-2 bg-lake text-white text-sm font-bold px-5 py-2.5 rounded-full shrink-0">
                <IconSend className="w-4 h-4" /> Send via WhatsApp instead
              </a>
            </div>
          )}
        </form>
      </div>

      {successData && <SuccessModal booking={successData} onClose={() => setSuccessData(null)} />}
    </section>
  );
}

function AddReviewModal({ onClose, onSubmitted }) {
  const [name, setName] = useState("");

  const [text, setText] = useState("");
  const [errors, setErrors] = useState({});

  function validate() {
    const e = {};
    if (!name.trim() || name.trim().length < 2) e.name = "Please enter your name.";
    if (!text.trim() || text.trim().length < 10) e.text = "Please write a few words about your experience.";
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  async function handleSubmit(ev) {
    ev.preventDefault();
    setSubmitError("");
    if (!validate()) return;

    const review = {
      type: "review",
      name: name.trim(),
      place: place.trim(),
      rating,
      text: text.trim(),
      timestamp: new Date().toISOString(),
    };

    setIsSubmitting(true);
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(review),
      });
      const result = await res.json();
      if (result.success) {
        onSubmitted(review);
      } else {
        setSubmitError(result.error || "Could not submit your review. Please try again.");

    } catch (err) {
      setSubmitError("Could not reach the server. Please check your connection and try again.");
    } finally {
      setIsSubmitting(false);

  }

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-ink/60 backdrop-blur-sm p-0 sm:p-4" role="dialog" aria-modal="true">
      <div className="bg-mist w-full sm:max-w-md sm:rounded-3xl rounded-t-3xl p-6 md:p-8 animate-fade-up max-h-[92svh] overflow-y-auto">
        <div className="flex items-center justify-between mb-5">
          <h3 className="font-display text-2xl font-semibold text-ink">Share Your Experience</h3>
          <button onClick={onClose} aria-label="Close" className="w-8 h-8 rounded-full bg-black/5 flex items-center justify-center shrink-0">
            <IconX className="w-4 h-4 text-ink/60" />
          </button>
        </div>

        <form onSubmit={handleSubmit} className="space-y-5">
          <div>
            <p className="font-semibold text-ink text-sm mb-2">Your rating</p>
            <StarRatingInput value={rating} onChange={setRating} />
          </div>

          <div>
            <label className="font-semibold text-ink text-sm mb-2 block" htmlFor="rname">Your name</label>
            <input id="rname" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Ravi K."
              className="w-full rounded-xl border-2 border-black/10 bg-white px-4 py-3 text-ink focus:border-lily-rose transition" />
            {errors.name && <p className="text-lily-rose text-xs mt-1">{errors.name}</p>}
          </div>

          <div>
            <label className="font-semibold text-ink text-sm mb-2 block" htmlFor="rplace">Where you're from (optional)</label>
            <input id="rplace" value={place} onChange={e => setPlace(e.target.value)} placeholder="e.g. Kochi"
              className="w-full rounded-xl border-2 border-black/10 bg-white px-4 py-3 text-ink focus:border-lily-rose transition" />
          </div>

          <div>
            <label className="font-semibold text-ink text-sm mb-2 block" htmlFor="rtext">Your review</label>
            <textarea id="rtext" value={text} onChange={e => setText(e.target.value)} rows={4} maxLength={500}
              placeholder="Tell us about your boat ride…"
              className="w-full rounded-xl border-2 border-black/10 bg-white px-4 py-3 text-ink focus:border-lily-rose transition resize-none" />
            {errors.text && <p className="text-lily-rose text-xs mt-1">{errors.text}</p>}
          </div>

          {submitError && <p className="text-lily-rose text-sm">{submitError}</p>}

          <button type="submit" disabled={isSubmitting}
            className="w-full inline-flex items-center justify-center gap-2 bg-lily-rose hover:bg-lily-pink disabled:opacity-60 text-white font-bold py-3.5 rounded-full transition">
            {isSubmitting ? (<><IconLoader className="w-5 h-5 animate-spin" /> Submitting…</>) : "Submit Review"}
          </button>
        </form>
      </div>
    </div>
  );
}

function Reviews() {
  const [reviews, setReviews] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [thanks, setThanks] = useState(false);

  useEffect(() => {
    let cancelled = false;
    fetch(APPS_SCRIPT_URL + "?action=reviews")
      .then(res => res.json())
      .then(data => { if (!cancelled) setReviews((data && data.reviews) || []); })
      .catch(() => { /* Apps Script URL not set yet, or offline — fall back to empty state */ })
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, []);

  function handleSubmitted(newReview) {
    setReviews(prev => [newReview, ...prev]);
    setShowModal(false);
    setThanks(true);
    setTimeout(() => setThanks(false), 6000);
  }

  return (
    <section id="reviews" className="py-16 md:py-24 bg-white">
      <div className="max-w-6xl mx-auto px-5 md:px-6">
        <div className="text-center max-w-xl mx-auto mb-10">
          <SectionEyebrow>Guest stories</SectionEyebrow>
          <h2 className="font-display text-3xl md:text-4xl font-semibold text-ink">What Visitors Say</h2>
        </div>

        {thanks && (
          <div className="max-w-md mx-auto mb-8 bg-lake/10 border border-lake/20 text-lake text-sm font-medium rounded-2xl px-4 py-3 text-center">
            Thank you! Your review is now live on the page.
          </div>
        )}

        {loading ? (
          <p className="text-center text-ink/40 text-sm mb-10">Loading reviews…</p>
        ) : reviews.length === 0 ? (
          <div className="text-center max-w-sm mx-auto mb-10">
            <p className="text-ink/50 font-medium">No reviews found yet — be the first to share your experience!</p>
          </div>
        ) : (
          <div className="grid sm:grid-cols-2 gap-5 mb-10">
            {reviews.map((r, i) => (
              <div key={i} className="bg-mist rounded-3xl p-6 border border-black/5">
                <div className="flex gap-1 mb-3">
                  {Array.from({ length: 5 }).map((_, si) => (
                    <IconStar key={si} className={"w-4 h-4 " + (si < r.rating ? "text-gold fill-gold" : "text-ink/15")} />
                  ))}
                </div>
                <p className="text-ink/75 text-sm leading-relaxed mb-4">"{r.text}"</p>
                <p className="font-semibold text-ink text-sm">
                  {r.name}{r.place ? <span className="text-ink/40 font-normal"> · {r.place}</span> : null}
                </p>
              </div>
            ))}
          </div>
        )}

        <div className="text-center">
          <button onClick={() => setShowModal(true)}
            className="inline-flex items-center gap-2 border-2 border-lily-rose text-lily-rose font-bold px-7 py-3 rounded-full hover:bg-lily-rose hover:text-white transition">
            <IconFlower className="w-4 h-4" /> Add Your Review
          </button>
        </div>
      </div>

      {showModal && <AddReviewModal onClose={() => setShowModal(false)} onSubmitted={handleSubmitted} />}
    </section>
  );
}

/* =====================================================================
   FOOTER
   ===================================================================== */
function Footer() {
  return (
    <footer id="contact" className="bg-lake-deep text-white/80 pt-16 md:pt-20 pb-8">
      <div className="max-w-6xl mx-auto px-5 md:px-6">
        <div className="grid md:grid-cols-3 gap-10 mb-12">
          <div>
            <div className="flex items-center gap-2 mb-4">
              <span className="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center"><IconFlower className="w-5 h-5 text-lily-pink" /></span>
              <span className="font-display font-semibold text-lg text-white">Malarikkal Boat Tours</span>
            </div>
            <p className="text-sm leading-relaxed">
              A family-run boat service on Malarikkal lake, Kottayam — home to Kerala's largest
              wild water lily bloom.
            </p>
          </div>

          <div>
            <p className="font-display text-white font-semibold mb-4">Get in touch</p>
            <div className="space-y-3 text-sm">
              <a href={"tel:" + OWNER_PHONE} className="flex items-center gap-2 hover:text-white transition"><IconPhone className="w-4 h-4" /> {OWNER_PHONE}</a>
              <a href={"https://wa.me/" + WHATSAPP_NUMBER} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 hover:text-white transition"><IconChat className="w-4 h-4" /> WhatsApp us</a>
              <a href={MAPS_LINK} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 hover:text-white transition"><IconMapPin className="w-4 h-4" /> Malarikkal Boat Jetty, Kottayam</a>
            </div>
          </div>

          <div>
            <p className="font-display text-white font-semibold mb-4">Boating hours</p>
            <ul className="space-y-2 text-sm">
              <li className="flex justify-between"><span>Sunrise Bloom</span><span>6:00 – 8:00 AM</span></li>
              <li className="flex justify-between"><span>Morning Glide</span><span>8:00 – 10:00 AM</span></li>
              <li className="flex justify-between"><span>Sunset Romance</span><span>5:00 – 6:30 PM</span></li>
            </ul>
          </div>
        </div>

        <div className="border-t border-white/10 pt-6 flex flex-col sm:flex-row justify-between items-center gap-3 text-xs text-white/50">
          <p>© {new Date().getFullYear()} Malarikkal Water Lily Boat Tours. All rights reserved.</p>
          <p>Built with ❤ for the backwaters of Kottayam.</p>
        </div>
      </div>
    </footer>
  );
}

function FloatingWhatsApp() {
  return (
    <a href={"https://wa.me/" + WHATSAPP_NUMBER} target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp"
      className="fixed bottom-5 right-5 z-40 w-14 h-14 rounded-full bg-[#25D366] text-white flex items-center justify-center shadow-xl hover:scale-105 transition">
      <IconChat className="w-6 h-6" />
    </a>
  );
}

/* =====================================================================
   ROOT APP
   ===================================================================== */
function App() {
  const formRef = useRef(null);
  const scrollToBooking = () => formRef.current && formRef.current.scrollIntoView({ behavior: "smooth" });

  return (
    <div className="font-body">
      <Header onBookClick={scrollToBooking} />
      <Hero onBookClick={scrollToBooking} />
      <Packages onBookClick={scrollToBooking} />
      <BookingSection formRef={formRef} />
      <Hosts />
      <Gallery />
      <Reviews />
      <Footer />
      <FloatingWhatsApp />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
