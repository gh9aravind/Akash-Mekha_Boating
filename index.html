<!-- Bug reporter — plain JS, deliberately independent of React/Babel below.
     If React itself fails to load or crashes, this still works and lets a
     visitor report the error. It reads window.APPS_SCRIPT_URL, which the
     React app sets once it starts up (see APPS_SCRIPT_URL in the CONFIG
     section further down). -->
<script>
(function () {
  var lang = "en";
  try { lang = localStorage.getItem("malarikkal_lang") || "en"; } catch (e) {}
  var shown = false;

  // Turns a raw User-Agent string into a short, readable device label.
  // Exposed on window so the React app (a separate script/context) can
  // reuse the same logic instead of duplicating it.
  window.getDeviceLabel = function (ua) {
    ua = ua || navigator.userAgent;
    if (/iPhone/i.test(ua)) return "iPhone";
    if (/iPad/i.test(ua)) return "iPad";
    if (/Android/i.test(ua)) return /Mobile/i.test(ua) ? "Android Mobile" : "Android Tablet";
    if (/Windows/i.test(ua)) return "Windows PC";
    if (/Macintosh/i.test(ua)) return "Mac";
    if (/Linux/i.test(ua)) return "Linux PC";
    return "Unknown Device";
  };

  var TEXT = {
    en: {
      title: "Something went wrong",
      body: "We noticed an error on this page. You can help by reporting it to the developer.",
      report: "Report this bug to developer",
      dismiss: "Dismiss",
      sending: "Sending…",
      sent: "Thanks — reported!",
    },
    ml: {
      title: "എന്തോ കുഴപ്പം സംഭവിച്ചു",
      body: "ഈ പേജിൽ ഒരു error ഞങ്ങൾ കണ്ടെത്തി. ഇത് ഡെവലപ്പറെ അറിയിക്കാൻ സഹായിക്കാം.",
      report: "ഡെവലപ്പറെ അറിയിക്കൂ",
      dismiss: "അടയ്ക്കുക",
      sending: "അയക്കുന്നു…",
      sent: "നന്ദി — റിപ്പോർട്ട് ചെയ്തു!",
    },
  };

  function showBugPopup(message) {
    if (shown) return; // one popup per page load is enough — avoid spamming on repeated/looping errors
    shown = true;
    var t = TEXT[lang] || TEXT.en;

    var overlay = document.createElement("div");
    overlay.setAttribute("style",
      "position:fixed;inset:0;z-index:99999;background:rgba(13,43,54,0.6);" +
      "display:flex;align-items:flex-end;justify-content:center;font-family:Manrope,sans-serif;");

    var panel = document.createElement("div");
    panel.setAttribute("style",
      "background:#FAF7F2;width:100%;max-width:420px;border-radius:24px 24px 0 0;" +
      "padding:24px;box-shadow:0 -8px 30px rgba(0,0,0,0.25);");

    var title = document.createElement("p");
    title.textContent = t.title;
    title.setAttribute("style", "font-weight:700;font-size:20px;color:#0D2B36;margin:0 0 8px;");

    var body = document.createElement("p");
    body.textContent = t.body;
    body.setAttribute("style", "color:#0D2B3699;font-size:14px;margin:0 0 20px;line-height:1.5;");

    var reportBtn = document.createElement("button");
    reportBtn.textContent = t.report;
    reportBtn.setAttribute("style",
      "width:100%;background:#F43F5E;color:#fff;font-weight:700;padding:14px;" +
      "border:none;border-radius:999px;margin-bottom:10px;font-size:14px;");

    var dismissBtn = document.createElement("button");
    dismissBtn.textContent = t.dismiss;
    dismissBtn.setAttribute("style",
      "width:100%;background:transparent;color:#0D2B3699;font-weight:600;padding:10px;border:none;font-size:14px;");

    reportBtn.onclick = function () {
      reportBtn.disabled = true;
      reportBtn.textContent = t.sending;
      var url = window.APPS_SCRIPT_URL;
      var done = function () { reportBtn.textContent = t.sent; };
      if (!url) { done(); return; }
      try {
        fetch(url, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            type: "bug",
            auto: true,
            message: String(message).slice(0, 500),
            pageUrl: window.location.href,
            userAgent: window.getDeviceLabel(navigator.userAgent),
            timestamp: new Date().toISOString(),
          }),
        }).then(done).catch(done); // best-effort — don't leave the visitor stuck either way
      } catch (e) { done(); }
    };

    dismissBtn.onclick = function () { document.body.removeChild(overlay); };

    panel.appendChild(title);
    panel.appendChild(body);
    panel.appendChild(reportBtn);
    panel.appendChild(dismissBtn);
    overlay.appendChild(panel);
    document.body.appendChild(overlay);
  }

  window.addEventListener("error", function (e) {
    showBugPopup((e && e.message) || "Unknown error");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e && e.reason;
    showBugPopup((reason && reason.message) || String(reason) || "Unhandled promise rejection");
  });
})();
</script>

function formatINR(n) { return "₹" + Number(n).toLocaleString("en-IN"); }

/**
 * Strips a typed +91 / 91 country code or a leading 0, so a number entered
 * as "+91 98765 43210", "0987654321", or "9876543210" all validate the
 * same way. Returns whatever it's given if it doesn't match a known shape,
 * so the regex check downstream still catches genuinely invalid input.
 */
function normalizeIndianPhone(raw) {
  let d = String(raw).replace(/\D/g, "");
  if (d.length === 12 && d.startsWith("91")) d = d.slice(2);
  else if (d.length === 11 && d.startsWith("0")) d = d.slice(1);
  return d;
}


function generateBookingId() {
  const stamp = Date.now().toString(36).toUpperCase().slice(-5);
  const rand = Math.random().toString(36).toUpperCase().slice(2, 5);
  return "MWL-" + stamp + rand;
}

function todayISO() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

/**
 * Fades + slides a section into view the first time it scrolls into the
 * viewport, then leaves it alone. Respects prefers-reduced-motion via the
 * global CSS rule (transition-duration is forced to ~0 there).
 */
function Reveal({ children, className = "", delay = 0, as = "div" }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  const Tag = as;

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      (entries) => {
        if (entries[0].isIntersecting) {
          setVisible(true);
          obs.disconnect();
        }
      },
      { threshold: 0.15, rootMargin: "0px 0px -40px 0px" }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  return (
    <Tag
      ref={ref}
      className={className}
      style={{
        opacity: visible ? 1 : 0,
        transform: visible ? "translateY(0)" : "translateY(22px)",
        transition: "opacity 0.7s cubic-bezier(0.16,1,0.3,1) " + delay + "ms, transform 0.7s cubic-bezier(0.16,1,0.3,1) " + delay + "ms",
      }}
    >
      {children}
    </Tag>
  );
}

/**
 * Shared modal behavior: locks background scroll while open and closes on
 * the Escape key. Used by every modal so behavior stays consistent.
 */
function useModalEffects(onClose) {
  useEffect(() => {
    const previousOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => {
      document.body.style.overflow = previousOverflow;
      window.removeEventListener("keydown", onKey);
    };
  }, [onClose]);
}

/**
 * Catches React render-time crashes anywhere below it in the tree and shows
 * a full-page fallback instead of leaving a blank white screen. Reads the
 * language straight from localStorage (not via useLang/context) since the
 * crashed subtree may include the LanguageContext.Provider itself.
 */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, message: "" };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, message: (error && error.message) || String(error) };
  }
  render() {
    if (this.state.hasError) return <ErrorFallback message={this.state.message} />;
    return this.props.children;
  }
}

function ErrorFallback({ message }) {
  const [status, setStatus] = useState("idle"); // idle | sending | sent
  let lang = "en";
  try { lang = localStorage.getItem("malarikkal_lang") || "en"; } catch (e) { /* ignore */ }
  const t = (T[lang] || T.en).bugReport;

  async function handleReport() {
    setStatus("sending");
    try {
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          type: "bug", auto: true, message: String(message).slice(0, 500),
          pageUrl: window.location.href, userAgent: window.getDeviceLabel(navigator.userAgent),
          timestamp: new Date().toISOString(),
        }),
      });
    } catch (e) { /* best-effort — still confirm below so the visitor isn't stuck */ }
    setStatus("sent");
  }

  return (
    <div className="fixed inset-0 z-[9999] bg-mist flex flex-col items-center justify-center p-6 text-center font-body">
      <p className="font-display text-2xl font-bold text-ink mb-2">{t.fallbackTitle}</p>
      <p className="text-ink/60 text-sm mb-6 max-w-xs">{t.fallbackBody}</p>
      <button onClick={handleReport} disabled={status !== "idle"}
        className="w-full max-w-xs bg-lily-rose text-white font-bold px-7 py-3.5 rounded-full mb-3 active:scale-95 transition disabled:opacity-70">
        {status === "sending" ? t.sending : status === "sent" ? t.sent : t.reportBtn}
      </button>
      <button onClick={() => window.location.reload()} className="text-ink/50 font-semibold text-sm py-2">
        {t.reload}
      </button>
    </div>
  );
}

/* =====================================================================

   ===================================================================== */
function BookingSection({ formRef }) {
  const { lang } = useLang();
  const t = T[lang].booking;
  const [timeSlot, setTimeSlot] = useState(TIME_SLOTS[0].id);
  const [date, setDate] = useState("");
  const [adults, setAdults] = useState(2);
  const [kids, setKids] = useState(0);
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [errors, setErrors] = useState({});
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState("");
  const [successData, setSuccessData] = useState(null);

  const slot = TIME_SLOTS.find(s => s.id === timeSlot);
  const total = BOAT_RATE; // flat rate per boat, regardless of headcount

  function validate() {
    const e = {};
    if (!name.trim() || name.trim().length < 2) e.name = t.errors.name;
    const digits = normalizeIndianPhone(phone);
    if (!/^[6-9]\d{9}$/.test(digits)) e.phone = t.errors.phone;
    if (!date) e.date = t.errors.dateRequired;
    else if (date < todayISO()) e.date = t.errors.datePast;
    if (adults < 1) e.adults = t.errors.maxGuests(MAX_GUESTS);
    if (adults + kids > MAX_GUESTS) e.adults = t.errors.maxGuests(MAX_GUESTS);
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  async function handleSubmit(ev) {
    ev.preventDefault();
    setSubmitError("");
    if (!validate()) return;

    const booking = {
      bookingId: generateBookingId(),
      name: name.trim(),
      phone: normalizeIndianPhone(phone),
      date,
      timeSlot: slot.id,
      timeSlotLabel: slot.label,
      adults, kids,
      totalPrice: total,
      timestamp: new Date().toISOString(),
    };

    setIsSubmitting(true);
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        // text/plain avoids a CORS preflight against Apps Script (see SETUP_GUIDE.md)
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(booking),
      });
      const result = await res.json();
      if (result.success) {
        setSuccessData(booking);
        setName(""); setPhone(""); setDate(""); setAdults(2); setKids(0);
      } else {
        setSubmitError(result.error || t.errors.saveFailed);
      }
    } catch (err) {
      setSubmitError(t.errors.unreachable);
    } finally {
      setIsSubmitting(false);
    }
  }

  return (
    <section id="book" ref={formRef} className="relative bg-lake-deep py-16 md:py-24">
      <div className="max-w-5xl mx-auto px-5 md:px-6">
        <div className="text-center max-w-xl mx-auto mb-10">
          <SectionEyebrow>{t.eyebrow}</SectionEyebrow>
          <h2 className="font-display text-3xl md:text-4xl font-semibold text-white">{t.title}</h2>
          <p className="text-white/60 mt-3 text-sm md:text-base">{t.subtitle}</p>
        </div>

        <form onSubmit={handleSubmit} className="glass rounded-3xl p-5 md:p-8 shadow-2xl">
          {/* Time slot */}
          <p className="font-semibold text-ink mb-3 text-sm">{t.chooseSlot}</p>
          <div className="grid grid-cols-2 gap-3 mb-6">
            {TIME_SLOTS.map(s => {
              const SlotIcon = s.icon;
              const active = timeSlot === s.id;
              return (
                <button type="button" key={s.id} onClick={() => setTimeSlot(s.id)}
                  className={"text-left rounded-2xl p-4 border-2 transition " + (active ? "border-lily-rose bg-white shadow-lg" : "border-white/50 bg-white/40 hover:bg-white/70")}>
                  <div className="flex items-start justify-between mb-2">
                    <SlotIcon className={"w-5 h-5 " + (active ? "text-lily-rose" : "text-lake")} />
                    {s.best && <span className="text-[10px] font-bold text-gold">✨ {T[lang].pricing.best}</span>}
                  </div>
                  <p className="font-bold text-ink text-sm">{s.label}</p>
                </button>
              );
            })}
          </div>

          {/* Date */}
          <div className="mb-6">
            <label className="font-semibold text-ink text-sm mb-2 flex items-center gap-1.5" htmlFor="date">
              <IconCalendar className="w-4 h-4" /> {t.tourDate}
            </label>
            <input id="date" type="date" min={todayISO()} value={date} onChange={e => setDate(e.target.value)}
              className="w-full rounded-xl border-2 border-white/70 bg-white/70 px-4 py-3 text-ink font-medium focus:border-lily-rose transition" />
            {errors.date && <p className="text-lily-rose text-xs mt-1">{errors.date}</p>}
          </div>

          {/* Counters */}
          <div className="grid sm:grid-cols-2 gap-3 mb-2">
            <Counter label={t.adults} sub={t.adultsSub} value={adults} onChange={setAdults} min={1} max={MAX_GUESTS - kids} />
            <Counter label={t.kids} sub={t.kidsSub} value={kids} onChange={setKids} min={0} max={MAX_GUESTS - adults} />
          </div>
          <p className="text-xs text-white/50 mb-4">{t.seatsUsed(adults + kids, MAX_GUESTS)}</p>
          {errors.adults && <p className="text-lily-rose text-xs -mt-2 mb-4">{errors.adults}</p>}


          {/* Name / phone */}
          <div className="grid sm:grid-cols-2 gap-4 mb-6">
            <div>
              <label className="font-semibold text-ink text-sm mb-2 flex items-center gap-1.5" htmlFor="name">
                <IconUser className="w-4 h-4" /> {t.fullName}
              </label>
              <input id="name" type="text" value={name} onChange={e => setName(e.target.value)} placeholder={t.namePlaceholder}
                className="w-full rounded-xl border-2 border-white/70 bg-white/70 px-4 py-3 text-ink focus:border-lily-rose transition" />
              {errors.name && <p className="text-lily-rose text-xs mt-1">{errors.name}</p>}
            </div>
            <div>
              <label className="font-semibold text-ink text-sm mb-2 flex items-center gap-1.5" htmlFor="phone">
                <IconPhone className="w-4 h-4" /> {t.whatsappNumber}
              </label>
              <input id="phone" type="tel" value={phone} onChange={e => setPhone(e.target.value)} placeholder={t.phonePlaceholder}
                className="w-full rounded-xl border-2 border-white/70 bg-white/70 px-4 py-3 text-ink focus:border-lily-rose transition" />
              {errors.phone && <p className="text-lily-rose text-xs mt-1">{errors.phone}</p>}
            </div>
          </div>

          {/* Total + submit */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-5 border-t border-white/50">
            <div>
              <p className="text-xs text-ink/60 uppercase tracking-widest font-semibold">{t.totalPrice}</p>
              <p className="font-display text-3xl font-bold text-lake">{formatINR(total)}</p>
              <p className="text-xs text-ink/50">{t.perBoat} · {adults} {t.adultWord}{kids > 0 ? " · " + kids + " " + t.kidWord : ""}</p>
            </div>
            <button type="submit" disabled={isSubmitting}
              className="inline-flex items-center justify-center gap-2 bg-lily-rose hover:bg-lily-pink disabled:opacity-60 text-white font-bold px-8 py-4 rounded-full shadow-lg shadow-lily-rose/30 active:scale-95 transition hover:-translate-y-0.5">
              {isSubmitting ? (<><IconLoader className="w-5 h-5 animate-spin" /> {t.booking}</>) : (<>{t.confirmBooking} <IconArrowRight className="w-4 h-4" /></>)}
            </button>
          </div>

          {submitError && (
            <div className="mt-5 bg-lily-rose/10 border border-lily-rose/40 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <p className="text-sm text-lily-rose font-medium">{submitError}</p>
              <a href={"https://wa.me/" + WHATSAPP_NUMBER + "?text=" + buildWhatsAppMessage({ bookingId: "(pending)", name, phone, date, timeSlotLabel: slot.label, adults, kids, totalPrice: total })}
                target="_blank" rel="noopener noreferrer"
                className="inline-flex items-center justify-center gap-2 bg-lake text-white text-sm font-bold px-5 py-2.5 rounded-full shrink-0 active:scale-95 transition">
                <IconSend className="w-4 h-4" /> {t.sendWhatsappInstead}
              </a>
            </div>
          )}
        </form>
      </div>

      {successData && <SuccessModal booking={successData} onClose={() => setSuccessData(null)} />}
    </section>
  );
}

function BugReportModal({ onClose }) {
  const { lang } = useLang();
  const t = T[lang].bugReport;
  const [message, setMessage] = useState("");
  const [error, setError] = useState("");
  const [status, setStatus] = useState("idle"); // idle | sending | sent
  useModalEffects(onClose);

  async function handleSubmit(ev) {
    ev.preventDefault();
    if (!message.trim()) { setError(t.errors.empty); return; }
    setError("");
    setStatus("sending");
    try {
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          type: "bug", auto: false, message: message.trim(),
          pageUrl: window.location.href, userAgent: window.getDeviceLabel(navigator.userAgent),
          timestamp: new Date().toISOString(),
        }),
      });
    } catch (e) { /* best-effort — still confirm below */ }
    setStatus("sent");
  }

  return ReactDOM.createPortal(
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-ink/60 backdrop-blur-sm p-0 sm:p-4 animate-fade-in" role="dialog" aria-modal="true">
      <div onClick={e => e.stopPropagation()} className="bg-mist w-full sm:max-w-md sm:rounded-3xl rounded-t-3xl p-6 md:p-8 animate-modal-pop max-h-[92svh] overflow-y-auto">
        <div className="flex items-center justify-between mb-5">
          <h3 className="font-display text-2xl font-semibold text-ink">{t.modalTitle}</h3>
          <button onClick={onClose} aria-label="Close" className="w-8 h-8 rounded-full bg-black/5 flex items-center justify-center shrink-0 active:scale-90 transition">
            <IconX className="w-4 h-4 text-ink/60" />
          </button>
        </div>

        {status === "sent" ? (
          <div className="text-center py-6">
            <div className="w-14 h-14 rounded-full bg-lake/10 flex items-center justify-center mx-auto mb-4">
              <IconCheck className="w-7 h-7 text-lake" />
            </div>
            <p className="text-ink font-semibold">{t.sent}</p>
          </div>
        ) : (
          <form onSubmit={handleSubmit} className="space-y-4">
            <p className="text-ink/60 text-sm">{t.modalPrompt}</p>
            <textarea value={message} onChange={e => setMessage(e.target.value)} rows={5} maxLength={800}
              placeholder={t.placeholder}
              className="w-full rounded-xl border-2 border-black/10 bg-white px-4 py-3 text-ink focus:border-lily-rose transition resize-none" />
            {error && <p className="text-lily-rose text-xs">{error}</p>}
            <button type="submit" disabled={status === "sending"}
              className="w-full inline-flex items-center justify-center gap-2 bg-lily-rose hover:bg-lily-pink disabled:opacity-60 text-white font-bold py-3.5 rounded-full active:scale-95 transition">
              {status === "sending" ? (<><IconLoader className="w-5 h-5 animate-spin" /> {t.sending}</>) : t.submit}
            </button>
          </form>
        )}
      </div>
    </div>,
    document.body
  );
}

function AddReviewModal({ onClose, onSubmitted }) {
  const { lang } = useLang();
  const t = T[lang].addReview;
  const [name, setName] = useState("");
  const [place, setPlace] = useState("");
  const [rating, setRating] = useState(5);
  const [text, setText] = useState("");
  const [errors, setErrors] = useState({});
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState("");
  useModalEffects(onClose);

  function validate() {
    const e = {};
    if (!name.trim() || name.trim().length < 2) e.name = t.errors.name;
    if (!text.trim() || text.trim().length < 10) e.text = t.errors.text;
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  async function handleSubmit(ev) {
    ev.preventDefault();
    setSubmitError("");
    if (!validate()) return;

    const review = {
      type: "review",
      name: name.trim(),
      place: place.trim(),
      rating,
      text: text.trim(),
      timestamp: new Date().toISOString(),
    };

    setIsSubmitting(true);
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(review),
      });
      const result = await res.json();
      if (result.success) {
        onSubmitted(review);
      } else {
        setSubmitError(result.error || t.errors.submitFailed);
      }
    } catch (err) {
      setSubmitError(t.errors.unreachable);
    } finally {
      setIsSubmitting(false);
    }
  }

  return ReactDOM.createPortal(
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-ink/60 backdrop-blur-sm p-0 sm:p-4 animate-fade-in" role="dialog" aria-modal="true">
      <div onClick={e => e.stopPropagation()} className="bg-mist w-full sm:max-w-md sm:rounded-3xl rounded-t-3xl p-6 md:p-8 animate-modal-pop max-h-[92svh] overflow-y-auto">
        <div className="flex items-center justify-between mb-5">
          <h3 className="font-display text-2xl font-semibold text-ink">{t.title}</h3>
          <button onClick={onClose} aria-label="Close" className="w-8 h-8 rounded-full bg-black/5 flex items-center justify-center shrink-0 active:scale-90 transition">
            <IconX className="w-4 h-4 text-ink/60" />
          </button>
        </div>

        <form onSubmit={handleSubmit} className="space-y-5">
          <div>
            <p className="font-semibold text-ink text-sm mb-2">{t.yourRating}</p>
            <StarRatingInput value={rating} onChange={setRating} />
          </div>

          <div>
            <label className="font-semibold text-ink text-sm mb-2 block" htmlFor="rname">{t.yourName}</label>
            <input id="rname" value={name} onChange={e => setName(e.target.value)} placeholder={t.namePlaceholder}
              className="w-full rounded-xl border-2 border-black/10 bg-white px-4 py-3 text-ink focus:border-lily-rose transition" />
            {errors.name && <p className="text-lily-rose text-xs mt-1">{errors.name}</p>}
          </div>

          <div>
            <label className="font-semibold text-ink text-sm mb-2 block" htmlFor="rplace">{t.fromWhere}</label>
            <input id="rplace" value={place} onChange={e => setPlace(e.target.value)} placeholder={t.placePlaceholder}
              className="w-full rounded-xl border-2 border-black/10 bg-white px-4 py-3 text-ink focus:border-lily-rose transition" />
          </div>

          <div>
            <label className="font-semibold text-ink text-sm mb-2 block" htmlFor="rtext">{t.yourReview}</label>
            <textarea id="rtext" value={text} onChange={e => setText(e.target.value)} rows={4} maxLength={500}
              placeholder={t.reviewPlaceholder}
              className="w-full rounded-xl border-2 border-black/10 bg-white px-4 py-3 text-ink focus:border-lily-rose transition resize-none" />
            {errors.text && <p className="text-lily-rose text-xs mt-1">{errors.text}</p>}
          </div>

          {submitError && <p className="text-lily-rose text-sm">{submitError}</p>}

          <button type="submit" disabled={isSubmitting}
            className="w-full inline-flex items-center justify-center gap-2 bg-lily-rose hover:bg-lily-pink disabled:opacity-60 text-white font-bold py-3.5 rounded-full active:scale-95 transition">
            {isSubmitting ? (<><IconLoader className="w-5 h-5 animate-spin" /> {t.submitting}</>) : t.submit}
          </button>
        </form>
      </div>
    </div>,
    document.body
  );
}

function Reviews() {
  const { lang } = useLang();
  const t = T[lang].reviews;
  const [reviews, setReviews] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [thanks, setThanks] = useState(false);

  useEffect(() => {
    let cancelled = false;
    fetch(APPS_SCRIPT_URL + "?action=reviews")
      .then(res => res.json())
      .then(data => { if (!cancelled) setReviews((data && data.reviews) || []); })
      .catch(() => { /* Apps Script URL not set yet, or offline — fall back to empty state */ })
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, []);

  function handleSubmitted(newReview) {
    setReviews(prev => [newReview, ...prev]);
    setShowModal(false);
    setThanks(true);
    setTimeout(() => setThanks(false), 6000);
  }

  return (
    <section id="reviews" className="py-16 md:py-24 bg-white">
      <div className="max-w-6xl mx-auto px-5 md:px-6">
        <div className="text-center max-w-xl mx-auto mb-10">
          <SectionEyebrow>{t.eyebrow}</SectionEyebrow>
          <h2 className="font-display text-3xl md:text-4xl font-semibold text-ink">{t.title}</h2>
        </div>

        {thanks && (
          <div className="max-w-md mx-auto mb-8 bg-lake/10 border border-lake/20 text-lake text-sm font-medium rounded-2xl px-4 py-3 text-center">
            {t.thanks}
          </div>
        )}

        {loading ? (
          <div className="grid sm:grid-cols-2 gap-5 mb-10">
            {[0, 1].map(i => (
              <div key={i} className="bg-mist rounded-3xl p-6 border border-black/5">
                <div className="skeleton h-4 w-24 rounded mb-4"></div>
                <div className="skeleton h-3 w-full rounded mb-2"></div>
                <div className="skeleton h-3 w-5/6 rounded mb-4"></div>
                <div className="skeleton h-3 w-32 rounded"></div>
              </div>
            ))}
          </div>
        ) : reviews.length === 0 ? (
          <div className="text-center max-w-sm mx-auto mb-10">
            <p className="text-ink/50 font-medium">{t.empty}</p>
          </div>
        ) : (
          <div className="grid sm:grid-cols-2 gap-5 mb-10">
            {reviews.map((r, i) => (
              <Reveal key={i} delay={(i % 4) * 80} className="bg-mist rounded-3xl p-6 border border-black/5">
                <div className="flex gap-1 mb-3">
                  {Array.from({ length: 5 }).map((_, si) => (
                    <IconStar key={si} className={"w-4 h-4 " + (si < r.rating ? "text-gold fill-gold" : "text-ink/15")} />
                  ))}
                </div>
                <p className="text-ink/75 text-sm leading-relaxed mb-4">"{r.text}"</p>
                <p className="font-semibold text-ink text-sm">
                  {r.name}{r.place ? <span className="text-ink/40 font-normal"> · {r.place}</span> : null}
                </p>
              </Reveal>
            ))}
          </div>
        )}

        <div className="text-center">
          <button onClick={() => setShowModal(true)}
            className="inline-flex items-center gap-2 border-2 border-lily-rose text-lily-rose font-bold px-7 py-3 rounded-full hover:bg-lily-rose hover:text-white active:scale-95 transition">
            <IconFlower className="w-4 h-4" /> {t.addYours}
          </button>
        </div>
      </div>

      {showModal && <AddReviewModal onClose={() => setShowModal(false)} onSubmitted={handleSubmitted} />}
    </section>
  );
}

function FloatingWhatsApp() {
  const [visible, setVisible] = useState(true);
  const lastY = useRef(0);

  useEffect(() => {
    lastY.current = window.scrollY;
    const onScroll = () => {
      const y = window.scrollY;
      const goingDown = y > lastY.current;
      setVisible(!goingDown || y < 100); // always show near the very top, regardless of direction
      lastY.current = y;
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return (
    <a href={"https://wa.me/" + WHATSAPP_NUMBER} target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp"
      className={"fixed bottom-5 right-5 z-40 w-14 h-14 rounded-full bg-[#25D366] text-white flex items-center justify-center shadow-xl hover:scale-105 active:scale-90 transition-all duration-300 " +
        (visible ? "opacity-100 translate-y-0 scale-100" : "opacity-0 translate-y-20 scale-75 pointer-events-none")}>
      <IconChat className="w-6 h-6" />
    </a>
  );
}

/* =====================================================================
   ROOT APP
   ===================================================================== */
function App() {
  const formRef = useRef(null);
  const scrollToBooking = () => formRef.current && formRef.current.scrollIntoView({ behavior: "smooth" });

  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem("malarikkal_lang") || "en"; } catch (e) { return "en"; }
  });
  useEffect(() => {
    document.documentElement.lang = lang === "ml" ? "ml" : "en";
  }, [lang]);
  const toggleLang = () => {
    setLang(prev => {
      const next = prev === "en" ? "ml" : "en";
      try { localStorage.setItem("malarikkal_lang", next); } catch (e) { /* private mode etc. — ignore */ }
      return next;
    });
  };

  return (
    <LanguageContext.Provider value={{ lang, toggleLang }}>
      <div className="font-body" onContextMenu={e => e.preventDefault()} onDragStart={e => e.preventDefault()}>
        <Header onBookClick={scrollToBooking} />
        <Hero onBookClick={scrollToBooking} />
        <Packages onBookClick={scrollToBooking} />
        <BookingSection formRef={formRef} />
        <Hosts />
        <Gallery />
        <Reviews />
        <Footer />
        <FloatingWhatsApp />
      </div>
    </LanguageContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
